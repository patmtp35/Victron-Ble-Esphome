#############################################
# V5.0 – Unified BLE + VE.Direct Redundant
# 2 MPPT (100/20 + 100/30)
# Chaque MPPT : BLE + VE.Direct
#############################################

substitutions:
  name: "victron-unified-esp"
  esphome_name: "VictronUnified-Esp"
  friendly_name: "Victron Unified Interface"
  
  # pour common.yaml
  sensor_prefix: "victron_unified"

  # sources externes
  external_components_source_ble: github://Fabian-Schmidt/esphome-victron_ble
  external_components_source_vedirect: github://KinDR007/VictronMPPT-ESPHOME@main

  device_description: "Victron BLE + VE.Direct Unified Interface"
  time_timezone: "Europe/Paris"
  projectname: "Pat.VictronUnified"
  appversion: "5.0.0"

  log_level: "VERBOSE"
  baud_ratelog: "0"

  ota_pswd: !secret ota_pswd
  ap_pwd: !secret ota_pswd

  adress_ip: !secret ip_victron_unified
  gateway_ip: !secret ip_gateway
  dns_ip: !secret ip_dns

  time_id: ha_time
  time_platform: homeassistant

  # BLE MPPT 100/20
  smart_10020_mac_address: !secret mppt100_20_mac
  smart_10020_encryption_key: !secret mppt100_20_key

  # BLE MPPT 100/30
  smart_10030_mac_address: !secret mppt100_30_mac
  smart_10030_encryption_key: !secret mppt100_30_key

  # SmartShunt 500a
  smartshunt500a_mac_address: !secret smartshunt500a_mac
  smartshunt500a_encryption_key: !secret smartshunt500a_key
   
  api_encryption_key: !secret smartsolar2key

#############################################
### ESP32 definition
#############################################

esp32:
  board: esp32dev
  framework:
    type: esp-idf

#############################################
### COMMON CONFIG
#############################################

<<: !include .common.yaml

#############################################
### EXTERNAL COMPONENTS
#############################################

external_components:
  - source: ${external_components_source_ble}
    refresh: 0s
  - source: ${external_components_source_vedirect}
    refresh: 0s

#############################################
### BLE TRACKER + BLE DEVICES
#############################################

esp32_ble_tracker:

victron_ble:
  - id: mppt10020_ble
    mac_address: ${smart_10020_mac_address}
    bindkey: ${smart_10020_encryption_key}

  - id: mppt10030_ble
    mac_address: ${smart_10030_mac_address}
    bindkey: ${smart_10030_encryption_key}

  - id: smartshunt500a_ble
    mac_address: ${smartshunt500a_mac_address}
    bindkey: ${smartshunt500a_encryption_key}
#############################################
### VE.Direct — Dual UART
#############################################

uart:
  # MPPT 100/20 VE.Direct
  - id: uart_vedirect1
    tx_pin: GPIO18    # NON CONNECTÉ
    rx_pin: GPIO19    # TX du MPPT100/20
    baud_rate: 19200
    rx_buffer_size: 256

  # MPPT 100/30 VE.Direct
  - id: uart_vedirect2
    tx_pin: GPIO17    # NON CONNECTÉ
    rx_pin: 16   # TX du MPPT100/30
    baud_rate: 19200
    rx_buffer_size: 256

  # SmartShunt 500A VE.Direct
  - id: uart_shunt500a
    tx_pin: GPIO21      # NON CONNECTÉ
    rx_pin: GPIO22      # TX du SmartShunt
    baud_rate: 19200
    rx_buffer_size: 256

victron:
  - uart_id: uart_vedirect1
    id: mppt10020_vd
    throttle: 10s

  - uart_id: uart_vedirect2
    id: mppt10030_vd
    throttle: 10s

  - uart_id: uart_shunt500a
    id: smartshunt500a_vd
    throttle: 5s
#############################################
### SENSOR DEFINITIONS – Unified Standard
#############################################

sensor:

  #################################################
  # MPPT 100/20 BLE
  #################################################
  - platform: victron_ble
    victron_ble_id: mppt10020_ble
    name: "mppt10020_ble_battery_voltage"
    type: BATTERY_VOLTAGE

  - platform: victron_ble
    victron_ble_id: mppt10020_ble
    name: "mppt10020_ble_panel_current"
    type: BATTERY_CURRENT

  - platform: victron_ble
    victron_ble_id: mppt10020_ble
    name: "mppt10020_ble_panel_voltage"
    type: INPUT_VOLTAGE

  - platform: victron_ble
    victron_ble_id: mppt10020_ble
    name: "mppt10020_ble_panel_power"
    type: PV_POWER

  - platform: victron_ble
    victron_ble_id: mppt10020_ble
    name: "mppt10020_ble_load_current"
    type: LOAD_CURRENT

  - platform: victron_ble
    victron_ble_id: mppt10020_ble
    name: "mppt10020_ble_yield_today"
    type: YIELD_TODAY

  - platform: victron_ble
    victron_ble_id: mppt10020_ble
    name: "mppt10020_ble_temperature"
    type: TEMPERATURE

  #################################################
  # MPPT 100/30 BLE
  #################################################
  - platform: victron_ble
    victron_ble_id: mppt10030_ble
    name: "mppt10030_ble_panel_voltage"
    type: INPUT_VOLTAGE

  - platform: victron_ble
    victron_ble_id: mppt10030_ble
    name: "mppt10030_ble_panel_power"
    type: PV_POWER

  - platform: victron_ble
    victron_ble_id: mppt10030_ble
    name: "mppt10030_ble_battery_voltage"
    type: BATTERY_VOLTAGE

  - platform: victron_ble
    victron_ble_id: mppt10030_ble
    name: "mppt10030_ble_panel_current"
    type: BATTERY_CURRENT

  - platform: victron_ble
    victron_ble_id: mppt10030_ble
    name: "mppt10030_ble_load_current"
    type: LOAD_CURRENT

  - platform: victron_ble
    victron_ble_id: mppt10030_ble
    name: "mppt10030_ble_yield_today"
    type: YIELD_TODAY

  - platform: victron_ble
    victron_ble_id: mppt10030_ble
    name: "mppt10030_ble_error_code"
    type: CHARGER_ERROR

  #################################################
  # SmartShunt 500A BLE
  #################################################

  - platform: victron_ble
    victron_ble_id: smartshunt500a_ble
    id: smartshunt500a_ble_battery_voltage
    name: "smartshunt500a_ble_battery_voltage"
    type: BATTERY_VOLTAGE

  - platform: victron_ble
    victron_ble_id: smartshunt500a_ble
    id: smartshunt500a_ble_battery_current
    name: "smartshunt500a_ble_battery_current"
    type: BATTERY_CURRENT

  - platform: victron_ble
    victron_ble_id: smartshunt500a_ble
    id: smartshunt500a_ble_battery_power
    name: "smartshunt500a_ble_battery_power"
    type: BATTERY_POWER

  - platform: victron_ble
    victron_ble_id: smartshunt500a_ble
    id: smartshunt500a_ble_soc
    name: "smartshunt500a_ble_soc"
    type: STATE_OF_CHARGE

#################################################
# SmartShunt 500A VE.Direct (étendu)
#################################################

  - platform: victron
    victron_id: smartshunt500a_vd
 
    battery_voltage:
      name: "smartshunt500a_vd_battery_voltage"
      id: smartshunt500a_vd_battery_voltage
      internal: true

    battery_current:
      name: "smartshunt500a_vd_battery_current"
      id: smartshunt500a_vd_battery_current
      internal: true

    instantaneous_power:
      name: "smartshunt500a_vd_power"
      id: smartshunt500a_vd_power
      internal: true

    battery_temperature:
      name: "smartshunt500a_vd_battery_temperature"
      internal: true

    time_to_go:
      name: "smartshunt500a_vd_time_to_go"
      unit_of_measurement: "min"
      internal: false   # 👈 exposé à Home Assistant

    state_of_charge:
      name: "smartshunt500a_vd_soc"
      id: smartshunt500a_vd_soc
      internal: true

    consumed_amp_hours:
      name: "smartshunt500a_vd_consumed_ah"
      id: smartshunt500a_vd_consumed_ah
      internal: true

    amount_of_discharged_energy:
      name: "smartshunt500a_vd_energy_discharged"
      unit_of_measurement: "kWh"
      internal: true

    amount_of_charged_energy:
      name: "smartshunt500a_vd_energy_charged"
      unit_of_measurement: "kWh"
      internal: true

    number_of_charge_cycles:
      name: "smartshunt500a_vd_charge_cycles"
      internal: true


  #################################################
  # MPPT 100/20 VE.Direct (avec id: ajoutés)
  #################################################
  - platform: victron
    victron_id: mppt10020_vd
    panel_voltage:
      name: "mppt10020_vd_panel_voltage"
      id: mppt10020_vd_panel_voltage
      internal: true
    panel_power:
      name: "mppt10020_vd_panel_power"
      id: mppt10020_vd_panel_power
      internal: true
    battery_voltage:
      name: "mppt10020_vd_battery_voltage"
      id: mppt10020_vd_battery_voltage
      internal: true
    battery_current:
      name: "mppt10020_vd_panel_current"
      id: mppt10020_vd_panel_current
      internal: true
    yield_today:
      name: "mppt10020_vd_yield_today"
      id: mppt10020_vd_yield_today
      internal: true
    yield_yesterday:
      name: "mppt10020_vd_yield_yesterday"
      id: mppt10020_vd_yield_yesterday
      internal: true
    yield_total:
      name: "mppt10020_vd_yield_total"
      id: mppt10020_vd_yield_total
      internal: true
    max_power_today:
      name: "mppt10020_vd_max_power_today"
      id: mppt10020_vd_max_power_today
      internal: true
    max_power_yesterday:
      name: "mppt10020_vd_max_power_yesterday"
      id: mppt10020_vd_max_power_yesterday
      internal: true
    day_number:
      name: "mppt10020_vd_day_number"
      id: mppt10020_vd_day_number
      internal: true
    error_code:
      name: "mppt10020_vd_error_code"
      id: mppt10020_vd_error_code
      internal: true
    charging_mode_id:
      name: "mppt10020_vd_charging_mode_id"
      id: mppt10020_vd_charging_mode_id
      internal: true
    tracking_mode_id:
      name: "mppt10020_vd_tracking_mode_id"
      id: mppt10020_vd_tracking_mode_id
      internal: true
    load_current:
      name: "mppt10020_vd_load_current"
      id: mppt10020_vd_load_current
      internal: true


  #################################################
  # MPPT 100/30 VE.Direct (inchangé)
  #################################################
  - platform: victron
    victron_id: mppt10030_vd
    panel_voltage:
      name: "mppt10030_vd_panel_voltage"
    panel_power:
      name: "mppt10030_vd_panel_power"
    battery_voltage:
      name: "mppt10030_vd_battery_voltage"
    battery_current:
      name: "mppt10030_vd_panel_current"
    yield_today:
      name: "mppt10030_vd_yield_today"
    yield_yesterday:
      name: "mppt10030_vd_yield_yesterday"
    yield_total:
      name: "mppt10030_vd_yield_total"
    max_power_today:
