#############################################
### BUTTONS
#############################################

button:
  # Bouton de restart spécifique pour recréer smartsolar1_esp_restart_esp
  - platform: restart
    name: "smartsolar1_esp_restart_esp"
    id: smartsolar1_esp_restart_esp

interval:

  # 🔋 Envoi des valeurs SmartShunt vers Venus
  - interval: 5s
    then:
      - if:
          condition:
            lambda: |-
              return !id(battery_topic_w).empty();
          then:
            - mqtt.publish:
                topic: device/victron_unified/Proxy
                payload: !lambda |-
                  JsonDocument doc;
                  doc["topicPath"] = id(battery_topic_w);

                  JsonObject v = doc["values"].to<JsonObject>();
                  //JsonObject v = doc.createNestedObject("values");
                  float vb = id(smartshunt500a_battery_voltage).state;
                  if (!isnan(vb)) {
                    if (vb < id(battery_min_voltage_today))
                      id(battery_min_voltage_today) = vb;
                    if (vb > id(battery_max_voltage_today))
                      id(battery_max_voltage_today) = vb;
                  }
                  if (!isnan(id(smartshunt500a_battery_voltage).state))
                    v["Dc/0/Voltage"] = id(smartshunt500a_battery_voltage).state;
  
                  if (!isnan(id(smartshunt500a_battery_current).state))
                    v["Dc/0/Current"] = id(smartshunt500a_battery_current).state;
 
                  if (!isnan(id(smartshunt500a_battery_power).state))
                    v["Dc/0/Power"] = id(smartshunt500a_battery_power).state;
  
                  if (!isnan(id(smartshunt500a_soc).state))
                    v["Soc"] = id(smartshunt500a_soc).state;
                  
                  /* 🔋 Consumed Ah (Victron natif) */
                  if (!isnan(id(smartshunt500a_vd_consumed_ah).state))
                  v["ConsumedAh"] = id(smartshunt500a_vd_consumed_ah).state;
                  
                  // 🔋 Capacité installée (OBLIGATOIRE pour GX)
                  v["InstalledCapacity"] = ${battery_installed_capacity_ah};
                  
                  // 🔋 Battery Min / Max Voltage Today (GX history-like)
                  if (id(battery_min_voltage_today) < 1000.0)
                    v["History/Daily/0/MinVoltage"] = id(battery_min_voltage_today);

                  if (id(battery_max_voltage_today) > 0.0)
                    v["History/Daily/0/MaxVoltage"] = id(battery_max_voltage_today);

                  // ⏱️ Time To Go (MINUTES)
                  if (!isnan(id(smartshunt500a_vd_time_to_go).state) &&
                      id(smartshunt500a_vd_time_to_go).state > 0) {
                    v["TimeToGo"] =
                      (int) id(smartshunt500a_vd_time_to_go).state;
                  }  

                  std::string out;
                  serializeJson(doc, out);
                  return out;
                qos: 0
                retain: false

  # ❤️ Keepalive GX (OBLIGATOIRE)
  - interval: 40s
    then:
      - if:
          condition:
            lambda: |-
              return !id(venus_portal_id).empty();
          then:
            - mqtt.publish:
                topic: !lambda |-
                  return std::string("R/") + id(venus_portal_id) + "/keepalive";
                payload: ""
                qos: 0
                retain: false

  # 🟢 STATUS — déclaration du SmartShunt (LA PIÈCE QUI MANQUAIT)
  - interval: 30s
    then:
      - mqtt.publish:
          topic: device/victron_unified/Status
          payload: |-
            {
              "clientId": "victron_unified",
              "connected": 1,
              "version": "esp-smartshunt",
              "services": {
                "battery1": "battery"
              }
            }
          qos: 0
          retain: true
##################################################################################
# MPPT 100/20 → Venus OS
##################################################################################
  - interval: 5s
    then:
      - mqtt.publish:
          topic: venus/solarcharger/mppt_100_20
          retain: true
          payload: !lambda |-
            JsonDocument doc;
            uint32_t now = millis() / 1000;

            // ---------------- PV Power ----------------
            float pwr = NAN;
            if (!isnan(id(mppt10020_vd_panel_power).state))
              pwr = id(mppt10020_vd_panel_power).state;

            // ---------------- dt ----------------
            uint32_t dt = 0;
            if (id(mppt10020_last_ts) > 0 && now >= id(mppt10020_last_ts))
              dt = now - id(mppt10020_last_ts);

            // ---------------- Yield Today (Wh) ----------------
            if (dt > 0 && !isnan(pwr) && pwr >= 0)
              id(mppt10020_yield_today_wh) += pwr * ((float)dt / 3600.0f);

            // ---------------- MaxPower Today ----------------
            if (!isnan(pwr) && pwr > id(mppt10020_max_power_today))
              id(mppt10020_max_power_today) = pwr;

            // ---------------- State mapping ----------------
            int state = 1;
            if (!isnan(id(mppt10020_vd_charging_mode_id).state)) {
              int m = (int) id(mppt10020_vd_charging_mode_id).state;
              if (m >= 3 && m <= 7) state = m;
            }

            // ---------------- Time accounting ----------------
            if (dt > 0) {
              switch (id(mppt10020_last_state)) {
                case 3: id(mppt10020_time_bulk)  += dt; break;
                case 4: id(mppt10020_time_abs)   += dt; break;
                case 5: id(mppt10020_time_float) += dt; break;
              }
            }

            id(mppt10020_last_state) = state;
            id(mppt10020_last_ts) = now;

            // ---------------- Max PV Voltage Today ----------------
            if (!isnan(id(mppt10020_vd_panel_voltage).state) &&
                id(mppt10020_vd_panel_voltage).state > id(mppt10020_max_pv_voltage_today))
              id(mppt10020_max_pv_voltage_today) = id(mppt10020_vd_panel_voltage).state;

            // ---------------- JSON payload ----------------
            JsonObject pv = doc["Pv"].to<JsonObject>();
            pv["V"] = id(mppt10020_vd_panel_voltage).state;

            JsonObject y = doc["Yield"].to<JsonObject>();
            y["Power"] = pwr;

            JsonObject dc0 = doc["Dc"]["0"].to<JsonObject>();
            dc0["Voltage"] = id(mppt10020_vd_battery_voltage).state;
            dc0["Current"] = id(mppt10020_vd_panel_current).state;

            JsonObject hist0 = doc["History"]["Daily"]["0"].to<JsonObject>();
            hist0["Yield"] = id(mppt10020_yield_today_wh) / 1000.0f;
            hist0["MaxPower"] = id(mppt10020_max_power_today);
            hist0["MaxPvVoltage"] = id(mppt10020_max_pv_voltage_today);
            hist0["TimeInBulk"] = id(mppt10020_time_bulk);
            hist0["TimeInAbsorption"] = id(mppt10020_time_abs);
            hist0["TimeInFloat"] = id(mppt10020_time_float);

            JsonObject hist1 = doc["History"]["Daily"]["1"].to<JsonObject>();
            hist1["Yield"] = id(mppt10020_yield_yesterday);

            JsonObject overall = doc["History"]["Overall"].to<JsonObject>();
            overall["DaysAvailable"] = 2;
            overall["Yield"] = id(mppt10020_yield_lifetime);

            JsonObject link = doc["Link"].to<JsonObject>();
            link["NetworkStatus"] = "0x04";

            JsonObject settings = doc["Settings"].to<JsonObject>();
            settings["ChargeCurrentLimit"] = 20.0;

            doc["Mode"] = 0;
            if (!isnan(id(mppt10020_vd_error_code).state))
              doc["ErrorCode"] = (int) id(mppt10020_vd_error_code).state;
            else
             doc["ErrorCode"] = 0;
            doc["State"] = state;
            doc["MppOperationMode"] = 2;

            std::string out;
            serializeJson(doc, out);
            return out;

##################################################################################
# MPPT 100/30 → Venus OS
##################################################################################
  - interval: 5s
    then:
      - mqtt.publish:
          topic: venus/solarcharger/mppt_100_30
          retain: true
          payload: !lambda |-
            JsonDocument doc;
