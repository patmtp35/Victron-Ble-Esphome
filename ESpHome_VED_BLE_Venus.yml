#############################################
# V6.0 - Rajout Venus Os Ready Via Mqtt
# V5.0 – Unified BLE + VE.Direct Redundant
# 1 smartshunt 500A
# 2 MPPT (100/20 + 100/30)
# Chaque MPPT +SmartShunt : BLE + VE.Direct + Mqtt
#############################################

substitutions:
  name: "victron-unifiedvenus-esp"
  esphome_name: "VictronUnifiedVenus-Esp"
  friendly_name: "Victron Unified Interface VenusOs Ready"
  
  # pour common.yaml
  sensor_prefix: "victron_unified"

  # sources externes
  external_components_source_ble: github://Fabian-Schmidt/esphome-victron_ble
  external_components_source_vedirect: github://KinDR007/VictronMPPT-ESPHOME@main

  device_description: "Victron BLE + VE.Direct Unified Interface VenusOs Ready"
  time_timezone: "Europe/Paris"
  projectname: "Pat.VictronUnifiedVenusReady"
  appversion: "6.0.0"

  log_level: "VERBOSE"
  baud_ratelog: "0"

  ota_pswd: !secret ota_pswd
  ap_pwd: !secret ota_pswd

  adress_ip: !secret ip_victron_unified
  gateway_ip: !secret ip_gateway
  dns_ip: !secret ip_dns

  time_id: ha_time
  time_platform: homeassistant
  
  # BLE MPPT 100/20
  smart_10020_mac_address: !secret mppt100_20_mac
  smart_10020_encryption_key: !secret mppt100_20_key

  # BLE MPPT 100/30
  smart_10030_mac_address: !secret mppt100_30_mac
  smart_10030_encryption_key: !secret mppt100_30_key

  # SmartShunt 500a
  smartshunt500a_mac_address: !secret smartshunt500a_mac
  smartshunt500a_encryption_key: !secret smartshunt500a_key
  battery_installed_capacity_ah: "300"

  api_encryption_key: !secret smartsolar2key
  
  venus_portal_id: !secret venus_portal_id
#############################################
### ESP32 definition
#############################################

esp32:
  board: esp32dev
  framework:
    type: esp-idf

#############################################
### COMMON CONFIG
#############################################

<<: !include .common.yaml

#############################################
### EXTERNAL COMPONENTS
#############################################

external_components:
  - source: ${external_components_source_ble}
    refresh: 0s
  - source: ${external_components_source_vedirect}
    refresh: 0s

#############################################
### TIMER
#############################################
time:
  - platform: homeassistant
    id: ha_time
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - lambda: |-
              // ---------- MPPT 100/20 ----------
              id(mppt10020_yield_yesterday) =
                id(mppt10020_yield_today_wh) / 1000.0f;

              id(mppt10020_yield_lifetime) +=
                id(mppt10020_yield_yesterday);

              id(mppt10020_yield_today_wh) = 0;
              id(mppt10020_time_bulk) = 0;
              id(mppt10020_time_abs) = 0;
              id(mppt10020_time_float) = 0;
              id(mppt10020_max_power_today) = 0;
              id(mppt10020_last_state) = 0;
              id(mppt10020_last_ts) = 0;

              // ---------- MPPT 100/30 ----------
              id(mppt10030_yield_yesterday) =
                id(mppt10030_yield_today_wh) / 1000.0f;

              id(mppt10030_yield_lifetime) +=
                id(mppt10030_yield_yesterday);

              id(mppt10030_yield_today_wh) = 0;
              id(mppt10030_time_bulk) = 0;
              id(mppt10030_time_abs) = 0;
              id(mppt10030_time_float) = 0;
              id(mppt10030_max_power_today) = 0;
              id(mppt10030_last_state) = 0;
              id(mppt10030_last_ts) = 0;

#############################################
### MQTT DU VENUS OS
#############################################

mqtt:
  broker: 192.168.3.248
  port: 1883
  discovery: false
  #log_topic: null
  client_id: victron_unified

  will_message:
    topic: device/victron_unified/Status
    payload: |-
      {
        "clientId": "victron_unified",
        "connected": 0,
        "services": {
          "battery1": "battery"
        }
      }

  on_connect:
    then:
      - mqtt.publish:
          topic: device/victron_unified/Status
          retain: true
          payload: |-
            {
              "clientId": "victron_unified",
              "connected": 1,
              "version": "6.0.0",
              "services": {
                "battery1": "battery"
              }
            }

  on_message:
    - topic: device/victron_unified/DBus
      then:
        - lambda: |-
            JsonDocument doc;
            auto err = deserializeJson(doc, x);
            if (err) {
              ESP_LOGW("mqtt", "DBus JSON parse failed");
              return;
            }

            /* ---------- portalId ---------- */
            if (doc["portalId"].is<const char*>()) {
              id(venus_portal_id) = doc["portalId"].as<const char*>();
              ESP_LOGI("mqtt", "PortalId: %s", id(venus_portal_id).c_str());
            }

            /* ---------- topicPath ---------- */
            if (doc["topicPath"].is<JsonObject>()) {
              JsonObject tp = doc["topicPath"];

              if (tp["battery1"]["W"].is<const char*>()) {
                id(battery_topic_w) = tp["battery1"]["W"].as<const char*>();
                ESP_LOGI("mqtt", "Battery W topic: %s", id(battery_topic_w).c_str());
              }
            }

#############################################
### BLE TRACKER + BLE DEVICES
#############################################

esp32_ble_tracker:

victron_ble:
  - id: mppt10020_ble
    mac_address: ${smart_10020_mac_address}
    bindkey: ${smart_10020_encryption_key}

  - id: mppt10030_ble
    mac_address: ${smart_10030_mac_address}
    bindkey: ${smart_10030_encryption_key}

  - id: smartshunt500a_ble
    mac_address: ${smartshunt500a_mac_address}
    bindkey: ${smartshunt500a_encryption_key}

#############################################
### VE.Direct — Dual UART
#############################################

uart:
  # MPPT 100/20 VE.Direct
  - id: uart_vedirect1
    tx_pin: GPIO18    # NON CONNECTÉ
    rx_pin: GPIO19    # TX du MPPT100/20
    baud_rate: 19200
    rx_buffer_size: 256

  # MPPT 100/30 VE.Direct
  - id: uart_vedirect2
    tx_pin: GPIO17    # NON CONNECTÉ
    rx_pin: 16   # TX du MPPT100/30
    baud_rate: 19200
    rx_buffer_size: 256

  # SmartShunt 500A VE.Direct
  - id: uart_shunt500a
    tx_pin: GPIO21      # NON CONNECTÉ
    rx_pin: GPIO22      # TX du SmartShunt
    baud_rate: 19200
    rx_buffer_size: 256

victron:
  - uart_id: uart_vedirect1
    id: mppt10020_vd
    throttle: 10s

  - uart_id: uart_vedirect2
    id: mppt10030_vd
    throttle: 10s

  - uart_id: uart_shunt500a
    id: smartshunt500a_vd
    throttle: 5s

globals:
  - id: venus_portal_id
    type: std::string
    initial_value: '""'

  - id: battery_instance
    type: int
    initial_value: '-1'

  - id: mppt10020_instance
    type: int
    initial_value: '-1'

  - id: mppt10030_instance
    type: int
    initial_value: '-1'

  - id: battery_topic_w
    type: std::string
    initial_value: ""

  - id: mppt10020_topic_w
    type: std::string
    initial_value: ""

  - id: mppt10030_topic_w
    type: std::string
    initial_value: ""
  
  - id: shunt_topic_w
    type: std::string
    initial_value: ""

  - id: shunt_productid_sent
    type: bool
    initial_value: "false"  

  - id: mppt10020_productid_sent
    type: bool
    initial_value: "false"

  - id: mppt10030_productid_sent
    type: bool
    initial_value: "false"    

  # MPPT 100/20 timers
  - id: mppt10020_last_state
    type: int
    initial_value: '0'
  - id: mppt10020_last_ts
    type: uint32_t
    initial_value: '0'
  - id: mppt10020_time_bulk
    type: uint32_t
    initial_value: '0'
  - id: mppt10020_time_abs
    type: uint32_t
    initial_value: '0'
  - id: mppt10020_time_float
    type: uint32_t
    initial_value: '0'

  # MPPT 100/30 timers
  - id: mppt10030_last_state
    type: int
    initial_value: '0'
  - id: mppt10030_last_ts
    type: uint32_t
    initial_value: '0'
  - id: mppt10030_time_bulk
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: mppt10030_time_abs
    type: uint32_t
    restore_value: true
    initial_value: '0'
  - id: mppt10030_time_float
    type: uint32_t
    restore_value: true
    initial_value: '0'    
    
   # MaxPower Today
  - id: mppt10020_max_power_today
    type: float
    initial_value: '0.0'

  - id: mppt10030_max_power_today
    type: float
    initial_value: '0.0'   

  # Yield Today (Wh cumulés depuis minuit)
  - id: mppt10020_yield_today_wh
    type: float
    initial_value: '0.0'

  - id: mppt10030_yield_today_wh
    type: float
    initial_value: '0.0'    

  - id: mppt10020_yield_lifetime
    type: float
    restore_value: true
    initial_value: '0.0'
  - id: mppt10030_yield_lifetime
    type: float
    restore_value: true
    initial_value: '0.0'

  # Yield Yesterday (kWh)
  - id: mppt10020_yield_yesterday
    type: float
    initial_value: '0.0'

  - id: mppt10030_yield_yesterday
    type: float
    initial_value: '0.0'

  # Max PV Voltage Today
  - id: mppt10020_max_pv_voltage_today
    type: float
    initial_value: '0.0'

  - id: mppt10030_max_pv_voltage_today
    type: float
    initial_value: '0.0'    
  - id: battery_min_voltage_today
    type: float
    initial_value: '1000.0'

  - id: battery_max_voltage_today
    type: float
    initial_value: '0.0'    
#############################################
### SENSOR DEFINITIONS – Unified Standard
#############################################

sensor:

  #################################################
  # MPPT 100/20 BLE
  #################################################
  - platform: victron_ble
    victron_ble_id: mppt10020_ble
    name: "mppt10020_ble_battery_voltage"
    type: BATTERY_VOLTAGE

  - platform: victron_ble
    victron_ble_id: mppt10020_ble
    name: "mppt10020_ble_panel_current"
    type: BATTERY_CURRENT

  - platform: victron_ble
    victron_ble_id: mppt10020_ble
    name: "mppt10020_ble_panel_voltage"
    type: INPUT_VOLTAGE

  - platform: victron_ble
    victron_ble_id: mppt10020_ble
    name: "mppt10020_ble_panel_power"
    type: PV_POWER

  - platform: victron_ble
    victron_ble_id: mppt10020_ble
    name: "mppt10020_ble_load_current"
    type: LOAD_CURRENT

  - platform: victron_ble
    victron_ble_id: mppt10020_ble
    name: "mppt10020_ble_yield_today"
    type: YIELD_TODAY

  - platform: victron_ble
    victron_ble_id: mppt10020_ble
    name: "mppt10020_ble_temperature"
    type: TEMPERATURE

  #################################################
  # MPPT 100/30 BLE
  #################################################
  - platform: victron_ble
    victron_ble_id: mppt10030_ble
    name: "mppt10030_ble_panel_voltage"
    type: INPUT_VOLTAGE

  - platform: victron_ble
    victron_ble_id: mppt10030_ble
    name: "mppt10030_ble_panel_power"
    type: PV_POWER

  - platform: victron_ble
    victron_ble_id: mppt10030_ble
    name: "mppt10030_ble_battery_voltage"
    type: BATTERY_VOLTAGE

  - platform: victron_ble
    victron_ble_id: mppt10030_ble
    name: "mppt10030_ble_panel_current"
    type: BATTERY_CURRENT

  - platform: victron_ble
    victron_ble_id: mppt10030_ble
    name: "mppt10030_ble_load_current"
    type: LOAD_CURRENT

  - platform: victron_ble
    victron_ble_id: mppt10030_ble
    name: "mppt10030_ble_yield_today"
    type: YIELD_TODAY

  - platform: victron_ble
    victron_ble_id: mppt10030_ble
    name: "mppt10030_ble_error_code"
    type: CHARGER_ERROR

  #################################################
  # SmartShunt 500A BLE
  #################################################

  - platform: victron_ble
    victron_ble_id: smartshunt500a_ble
    id: smartshunt500a_ble_battery_voltage
    name: "smartshunt500a_ble_battery_voltage"
    type: BATTERY_VOLTAGE

  - platform: victron_ble
    victron_ble_id: smartshunt500a_ble
    id: smartshunt500a_ble_battery_current
