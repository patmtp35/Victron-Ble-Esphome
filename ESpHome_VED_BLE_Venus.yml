      name: "mppt10030_vd_charging_mode_id"
      id: mppt10030_vd_charging_mode_id
    tracking_mode_id:
      name: "mppt10030_vd_tracking_mode_id"
    load_current:
      name: "mppt10030_vd_load_current"

#################################################
# SmartShunt 500A – Unified templates (BLE + VE.Direct)
#################################################
  - platform: template
    name: "DEBUG smartshunt BLE current raw"
    unit_of_measurement: "A"
    update_interval: 5s
    lambda: |-
      return id(smartshunt500a_ble_battery_current).state;

  - platform: template
    name: "DEBUG smartshunt VE.Direct current raw"
    unit_of_measurement: "A"
    update_interval: 5s
    lambda: |-
      return id(smartshunt500a_vd_battery_current).state;

  - platform: template
    name: "smartshunt500a_battery_power"
    id: smartshunt500a_battery_power
    device_class: power
    unit_of_measurement: "W"
    icon: "mdi:flash"
    update_interval: 5s
    lambda: |-
      // Priorité BLE (⚠️ correction signe)
      if (!isnan(id(smartshunt500a_ble_battery_power).state))
        return id(smartshunt500a_ble_battery_power).state;

      // Fallback VE.Direct = V * I
      if (!isnan(id(smartshunt500a_vd_battery_voltage).state) &&
          !isnan(id(smartshunt500a_vd_battery_current).state))
        return id(smartshunt500a_vd_battery_voltage).state *
               id(smartshunt500a_vd_battery_current).state;

      return NAN;

  - platform: template
    name: "smartshunt500a_consumed_ah"
    unit_of_measurement: "Ah"
    icon: "mdi:battery-minus"
    update_interval: 30s
    lambda: |-
      if (!isnan(id(smartshunt500a_vd_consumed_ah).state))
        return id(smartshunt500a_vd_consumed_ah).state;
      return NAN;
      
  - platform: template
    name: "smartshunt500a_battery_voltage"
    id: smartshunt500a_battery_voltage
    device_class: voltage
    unit_of_measurement: "V"
    update_interval: 5s
    lambda: |-
      if (!isnan(id(smartshunt500a_ble_battery_voltage).state))
        return id(smartshunt500a_ble_battery_voltage).state;
      return id(smartshunt500a_vd_battery_voltage).state;

  - platform: template
    name: "smartshunt500a_battery_current"
    id: smartshunt500a_battery_current
    device_class: current
    unit_of_measurement: "A"
    icon: "mdi:current-dc"
    update_interval: 5s
    lambda: |-
      if (!isnan(id(smartshunt500a_ble_battery_current).state))
        return id(smartshunt500a_ble_battery_current).state;
      return id(smartshunt500a_vd_battery_current).state;

  - platform: template
    name: "smartshunt500a_soc"
    id: smartshunt500a_soc
    device_class: battery
    unit_of_measurement: "%"
    update_interval: 5s
    icon: "mdi:battery-high"
    lambda: |-
      if (!isnan(id(smartshunt500a_ble_soc).state))
        return id(smartshunt500a_ble_soc).state;
      return id(smartshunt500a_vd_soc).state;

  - platform: template
    name: "smartsolar1_esp_battery_voltage"
    id: smartsolar1_esp_battery_voltage
    update_interval: 10s
    unit_of_measurement: "V"
    lambda: |-
      return id(mppt10020_vd_battery_voltage).state;

  - platform: template
    name: "smartsolar1_esp_panel_current"
    id: smartsolar1_esp_panel_current
    update_interval: 10s
    unit_of_measurement: "A"
    lambda: |-
      return id(mppt10020_vd_panel_current).state;

  - platform: template
    name: "smartsolar1_esp_panel_voltage"
    id: smartsolar1_esp_panel_voltage
    update_interval: 10s
    unit_of_measurement: "V"
    lambda: |-
      return id(mppt10020_vd_panel_voltage).state;

  - platform: template
    name: "smartsolar1_esp_panel_power"
    id: smartsolar1_esp_panel_power
    update_interval: 10s
    unit_of_measurement: "W"
    lambda: |-
      return id(mppt10020_vd_panel_power).state;

  - platform: template
    name: "smartsolar1_esp_load_current"
    id: smartsolar1_esp_load_current
    update_interval: 10s
    unit_of_measurement: "A"
    lambda: |-
      return id(mppt10020_vd_load_current).state;

  - platform: template
    name: "smartsolar1_esp_yield_today"
    id: smartsolar1_esp_yield_today
    update_interval: 60s
    unit_of_measurement: "Wh"
    lambda: |-
      return id(mppt10020_vd_yield_today).state;

  - platform: template
    name: "smartsolar1_esp_yield_yesterday"
