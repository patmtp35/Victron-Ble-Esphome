#############################################
### Select
#############################################
select:
  - platform: template
    name: "ESS Mode"
    options:
      - "Optimized"
      - "Optimized (no BatteryLife)"
      - "Keep charged"
      - "External control"
    set_action:
      - mqtt.publish:
          topic: N/${venus_portal_id}/settings/0/Ess/Mode # <-- ID corrigé
          payload: !lambda |-
            if (x == "Optimized") return "{\"value\":0}";
            if (x == "Optimized (no BatteryLife)") return "{\"value\":1}";
            if (x == "Keep charged") return "{\"value\":2}";
            if (x == "External control") return "{\"value\":3}";
            return "{\"value\":0}";

